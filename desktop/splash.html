<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orb</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: radial-gradient(ellipse at 30% 20%, #2a1548 0%, #0a0a0f 55%, #050508 100%);
        color: #f5f5f7;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        cursor: default;
        -webkit-app-region: drag;
      }
      .card {
        text-align: center;
        padding: 48px 56px;
        max-width: 420px;
      }
      .mark {
        width: 96px;
        height: 96px;
        margin: 0 auto 16px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
      }
      .mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .brand {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.03em;
        color: #f5f5f7;
        margin-bottom: 10px;
      }
      .status {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.55);
        margin-top: 8px;
        min-height: 1.4em;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 28px auto 0;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #c084fc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .hint {
        margin-top: 24px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.3);
        line-height: 1.5;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><img src="assets/logo.png" alt="Orb" /></div>
      <div class="brand">Orb</div>
      <p class="status" id="status">Starting local services…</p>
      <div class="spinner"></div>
      <p class="hint" id="hint">
        First launch may download search engine binaries. Models install from Setup.
      </p>
    </div>
    <script>
      const desktop = window.orbDesktop;
      const el = document.getElementById("status");
      const hint = document.getElementById("hint");
      if (desktop?.onStatus) {
        desktop.onStatus((message) => {
          if (el) el.textContent = message;
        });
      }
      if (desktop?.getAppInfo) {
        desktop.getAppInfo().then((info) => {
          if (hint && info?.version) {
            hint.textContent = `Orb v${info.version} · First launch may download search binaries.`;
          }
        }).catch(() => {});
      }
    </script>
  </body>
</html>
