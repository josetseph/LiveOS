services:
  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: liveos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: liveos
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    volumes:
      - ./data/local_db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d liveos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Neo4j removed — graph storage is now embedded Kuzu (no container needed)

  # RustFS Object Storage (S3-compatible, Apache 2.0)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: liveos-rustfs
    restart: unless-stopped
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: liveos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  # Typesense Full-Text Search
  typesense:
    image: typesense/typesense:27.1
    container_name: liveos-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: liveos-dev-key
    ports:
      - "8108:8108"
    volumes:
      - ./data/typesense:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8108'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liveos-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Override .env's localhost values with Docker service names inside the network
      QDRANT_HOST: qdrant
      TYPESENSE_HOST: typesense
      R2_ENDPOINT_URL: http://rustfs:9000
      FILES_URL: /files/liveos-assets
      INGESTION_PIPELINE_CONCURRENCY: 1
      MULTIMEDIA_CONCURRENCY: 1
      LOCAL_MODELS_SERVICE_URL: http://host.docker.internal:8791
      MARLIN_SERVICE_URL: http://host.docker.internal:8790
      DATABASE_TRANSACTION_POOLER_URL: postgresql://user:password@postgres:5432/liveos
      DATABASE_SESSION_POOLER_URL: postgresql://user:password@postgres:5432/liveos
      DATABASE_DIRECT_CONNECTION_URL: postgresql://user:password@postgres:5432/liveos
    ports:
      - "8700:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      qdrant:
        condition: service_started
      typesense:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local Models Service (Florence, Whisper, reranker, PDF visual extraction)
  # Optional Docker fallback — on macOS, prefer native host inference via
  # ./scripts/host-inference.sh enable (uses Apple Silicon MPS + launchd).
  local-models:
    profiles: ["docker-models"]
    build:
      context: ./backend
      dockerfile: local_models_service/Dockerfile
    container_name: liveos-local-models
    restart: unless-stopped
    environment:
      FLORENCE_MODEL_PATH: /models/florence-2-large
      WHISPER_MODEL_PATH: /models/whisper-large-v3-turbo
      RERANKER_MODEL_PATH: /models/qwen3-reranker-0.6b
      PDF_VISUAL_EXTRACTION_ENABLED: "true"
      PDF_VISUAL_EXTRACTION_MAX_PAGES: "0"
      PDF_VISUAL_RENDER_DPI: "144"
      PDF_VISUAL_TEXT_THRESHOLD: "80"
      FLORENCE_MAX_IMAGE_PIXELS: "1500000"
    ports:
      - "8791:8091"
    volumes:
      - ./backend/models/florence-2-large:/models/florence-2-large:ro
      - ./backend/models/whisper-large-v3-turbo:/models/whisper-large-v3-turbo:ro
      - ./backend/models/qwen3-reranker-0.6b:/models/qwen3-reranker-0.6b:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Marlin Video Understanding Service
  # Optional Docker fallback — on macOS, prefer native host inference via
  # ./scripts/host-inference.sh enable (uses Apple Silicon MPS + launchd).
  marlin:
    profiles: ["docker-models"]
    build:
      context: ./backend
      dockerfile: marlin_service/Dockerfile
    container_name: liveos-marlin
    restart: unless-stopped
    environment:
      MARLIN_MODEL_PATH: /models/marlin-2b
      FORCE_QWENVL_VIDEO_READER: pyav
      VIDEO_MAX_PIXELS: "200704"
      FPS: "2.0"
      FPS_MAX_FRAMES: "240"
      FPS_MIN_FRAMES: "4"
    ports:
      - "8790:8090"
    volumes:
      - ./backend/models/marlin-2b:/models/marlin-2b:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialization Service (one-shot — runs once, then exits)
  init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liveos-init
    env_file: ./backend/.env
    environment:
      # Override .env's localhost values with Docker service names inside the network
      QDRANT_HOST: qdrant
      TYPESENSE_HOST: typesense
      R2_ENDPOINT_URL: http://rustfs:9000
      FILES_URL: /files/liveos-assets
      INGESTION_PIPELINE_CONCURRENCY: 1
      MULTIMEDIA_CONCURRENCY: 1
      DATABASE_TRANSACTION_POOLER_URL: postgresql://user:password@postgres:5432/liveos
      DATABASE_SESSION_POOLER_URL: postgresql://user:password@postgres:5432/liveos
      DATABASE_DIRECT_CONNECTION_URL: postgresql://user:password@postgres:5432/liveos
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      qdrant:
        condition: service_started
      typesense:
        condition: service_healthy
    command: /bin/bash /app/scripts/init.sh
    volumes:
      - ./backend:/app
      - ./data:/data
    restart: "no"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liveos-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "/api/v1"
      NEXT_PUBLIC_FILES_URL: "/files/liveos-assets"
    ports:
      - "3700:3000"
    depends_on:
      - backend
